version: "3.9"

services:
  mongo:
    image: mongo:7.0
    container_name: ghost-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ghost_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.0-alpine
    container_name: ghost-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ghost_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ghost_mongo:
  ghost_redis: